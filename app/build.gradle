import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def floatLensHashFiles = { Collection<File> sourceFiles ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    sourceFiles.findAll { it != null && it.exists() }
            .sort { a, b -> a.path <=> b.path }
            .each { File source ->
                digest.update(project.relativePath(source).replace('\\', '/').getBytes('UTF-8'))
                digest.update((byte) 0)
                digest.update(source.bytes)
                digest.update((byte) 0)
            }
    return digest.digest().encodeHex().toString()
}

def hookRoot = file('src/main/java/com/yagay/floatlens/hook')
def hookCommonFiles = [
        file('src/main/java/com/yagay/floatlens/hook/FloatLensModule.java'),
        file('src/main/java/com/yagay/floatlens/hook/LsposedRuntimeProvider.java'),
        file('src/main/java/com/yagay/floatlens/LsposedRuntimeConfig.java'),
        file('src/main/resources/META-INF/xposed/java_init.list'),
        file('src/main/resources/META-INF/xposed/module.prop'),
        file('src/main/resources/META-INF/xposed/scope.list')
]
def googleHookFiles = new ArrayList<File>(hookCommonFiles)
googleHookFiles.addAll(fileTree(hookRoot) { include 'Google*.java' }.files)
googleHookFiles.add(file('src/main/java/com/yagay/floatlens/GoogleCtsContract.java'))
googleHookFiles.add(file('src/main/java/com/yagay/floatlens/CanonicalFramePolicy.java'))
def systemUiHookFiles = new ArrayList<File>(hookCommonFiles)
def systemServerHookFiles = new ArrayList<File>(hookCommonFiles)
systemServerHookFiles.add(file('src/main/java/com/yagay/floatlens/hook/SecureScreenshotHook.java'))

def googleHookFingerprint = floatLensHashFiles(googleHookFiles)
def systemUiHookFingerprint = floatLensHashFiles(systemUiHookFiles)
def systemServerHookFingerprint = floatLensHashFiles(systemServerHookFiles)

android {
    namespace 'com.yagay.floatlens'
    compileSdk 37

    defaultConfig {
        applicationId 'com.yagay.floatlens'
        minSdk 31
        targetSdk 37
        versionCode 188
        versionName '3.1.36'
        buildConfigField 'String', 'GOOGLE_HOOK_FINGERPRINT', '"'+googleHookFingerprint+'"'
        buildConfigField 'String', 'SYSTEMUI_HOOK_FINGERPRINT', '"'+systemUiHookFingerprint+'"'
        buildConfigField 'String', 'SYSTEM_SERVER_HOOK_FINGERPRINT', '"'+systemServerHookFingerprint+'"'
        ndk {
            // FloatLens targets modern Android phones; keep only the ABI actually used on current devices.
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation project(':ppocr-sdk')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
