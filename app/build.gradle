plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yagay.YFloat.standalone'
    compileSdk 37

    defaultConfig {
        applicationId 'com.yagay.YFloat'
        minSdk 31
        targetSdk 37
        versionCode 191
        versionName '3.1.39'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':feature')
}
