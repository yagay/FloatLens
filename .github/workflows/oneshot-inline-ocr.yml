name: One-shot Inline OCR Patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[run-inline-ocr-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch inline OCR result UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ResultTextActivity: one-shot interception for screenshot popup OCR.
          p = Path('app/src/main/java/com/yagay/floatlens/ResultTextActivity.java')
          s = p.read_text()
          marker = '    public static boolean show(Context c, String text, List<String> blocks, Bitmap image, Rect anchor) {\n'
          insert = '''    public interface InlineResultSink {\n        void onResult(String text, List<String> blocks);\n    }\n\n    private static final Object INLINE_LOCK = new Object();\n    private static Bitmap inlineImage;\n    private static InlineResultSink inlineSink;\n\n    public static void captureNextForImage(Bitmap image, InlineResultSink sink) {\n        synchronized (INLINE_LOCK) {\n            inlineImage = image;\n            inlineSink = sink;\n        }\n    }\n\n    public static void clearInlineForImage(Bitmap image) {\n        synchronized (INLINE_LOCK) {\n            if (inlineImage == image) {\n                inlineImage = null;\n                inlineSink = null;\n            }\n        }\n    }\n\n    private static InlineResultSink takeInlineSink(Bitmap image) {\n        synchronized (INLINE_LOCK) {\n            if (inlineSink == null || inlineImage != image) return null;\n            InlineResultSink sink = inlineSink;\n            inlineImage = null;\n            inlineSink = null;\n            return sink;\n        }\n    }\n\n'''
          if insert not in s:
              if marker not in s: raise SystemExit('ResultTextActivity show marker missing')
              s = s.replace(marker, insert + marker, 1)
          old = '''    public static boolean show(Context c, String text, List<String> blocks, Bitmap image, Rect anchor) {\n        if (c == null) return false;\n'''
          new = '''    public static boolean show(Context c, String text, List<String> blocks, Bitmap image, Rect anchor) {\n        if (c == null) return false;\n        InlineResultSink inline = takeInlineSink(image);\n        if (inline != null) {\n            try {\n                String value = text == null ? "" : text;\n                List<String> safeBlocks = blocks == null ? List.of() : new ArrayList<>(blocks);\n                inline.onResult(value, safeBlocks);\n                DiagnosticLog.i(c, "RESULT_TEXT_ACTIVITY", "INLINE chars=" + value.length()\n                        + " blocks=" + safeBlocks.size());\n                return true;\n            } catch (Throwable t) {\n                DiagnosticLog.i(c, "RESULT_TEXT_ACTIVITY", "INLINE_FAILED " + t);\n            }\n        }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('ResultTextActivity interception marker missing')
          p.write_text(s)

          # ScreenshotResultActivity: inline selectable OCR panel below image.
          p = Path('app/src/main/java/com/yagay/floatlens/ScreenshotResultActivity.java')
          s = p.read_text()
          s = s.replace('import android.view.WindowManager;\n', 'import android.view.WindowManager;\nimport android.view.View;\n')
          s = s.replace('import android.widget.LinearLayout;\n', 'import android.widget.LinearLayout;\nimport android.widget.ScrollView;\n')
          old_fields = '''    private long token;\n    private Payload payload;\n    private boolean ocrRunning;\n'''
          new_fields = '''    private long token;\n    private Payload payload;\n    private boolean ocrRunning;\n    private LinearLayout ocrPanel;\n    private TextView ocrText;\n    private Button ocrButton;\n    private Rect popupUsable;\n    private int popupWidth;\n'''
          if old_fields in s:
              s = s.replace(old_fields, new_fields, 1)
          elif new_fields not in s:
              raise SystemExit('Screenshot fields marker missing')

          anchor = '''        ImageShareUtils.attachLongPressShare(this, image, payload.image);\n        box.addView(image, new LinearLayout.LayoutParams(-1, 0, 1f));\n\n        LinearLayout actions = new LinearLayout(this);\n'''
          panel = '''        ImageShareUtils.attachLongPressShare(this, image, payload.image);\n        box.addView(image, new LinearLayout.LayoutParams(-1, 0, 1f));\n\n        ocrPanel = new LinearLayout(this);\n        ocrPanel.setOrientation(LinearLayout.VERTICAL);\n        ocrPanel.setVisibility(View.GONE);\n        ocrPanel.setPadding(0, dp(4), 0, dp(4));\n\n        TextView ocrHeading = new TextView(this);\n        ocrHeading.setText("OCR 文字");\n        ocrHeading.setTextColor(0xFFBBBBBB);\n        ocrHeading.setTextSize(13);\n        ocrHeading.setGravity(Gravity.CENTER_VERTICAL);\n        ocrPanel.addView(ocrHeading, new LinearLayout.LayoutParams(-1, dp(26)));\n\n        ScrollView ocrScroll = new ScrollView(this);\n        ocrScroll.setVerticalScrollBarEnabled(true);\n        ocrScroll.setScrollbarFadingEnabled(false);\n        ocrText = new TextView(this);\n        ocrText.setTextColor(Color.WHITE);\n        ocrText.setTextSize(16);\n        ocrText.setTextIsSelectable(true);\n        ocrText.setLongClickable(true);\n        ocrText.setPadding(dp(6), dp(3), dp(6), dp(3));\n        ocrScroll.addView(ocrText, new ScrollView.LayoutParams(-1, -2));\n        ocrPanel.addView(ocrScroll, new LinearLayout.LayoutParams(-1, 0, 1f));\n        box.addView(ocrPanel, new LinearLayout.LayoutParams(-1, dp(170)));\n\n        LinearLayout actions = new LinearLayout(this);\n'''
          if anchor in s:
              s = s.replace(anchor, panel, 1)
          elif panel not in s:
              raise SystemExit('Screenshot image marker missing')

          s = s.replace('        Button ocr = button("OCR");\n', '        ocrButton = button("OCR");\n')
          s = s.replace('        actions.addView(ocr, new LinearLayout.LayoutParams(0, -1, 1));\n', '        actions.addView(ocrButton, new LinearLayout.LayoutParams(0, -1, 1));\n')
          s = s.replace('        ocr.setOnClickListener(v -> runOcr(ocr));\n', '        ocrButton.setOnClickListener(v -> runOcr(ocrButton));\n')
          s = s.replace('        Rect usable = usableBounds();\n', '        Rect usable = usableBounds();\n        popupUsable = new Rect(usable);\n', 1)
          s = s.replace('        int width = Math.min(dp(410), maxW);\n', '        int width = Math.min(dp(410), maxW);\n        popupWidth = width;\n', 1)

          old_run = '''    private void runOcr(Button button) {\n        if (ocrRunning || payload == null || payload.image == null || payload.image.isRecycled()) return;\n        ocrRunning = true;\n        button.setEnabled(false);\n        button.setText("识别中…");\n        Bitmap image = payload.image;\n        Rect anchor = payload.anchor == null ? null : new Rect(payload.anchor);\n        DiagnosticLog.i(this, "SCREENSHOT_RESULT", "OCR_BUTTON image="\n                + image.getWidth() + "x" + image.getHeight());\n        Toast.makeText(this, "正在识别…", Toast.LENGTH_SHORT).show();\n        // Keep this Activity visible underneath the OCR result. Closing it before preprocessing made\n        // a slow/failing OCR pass look like the button did nothing and also removed useful context.\n        OcrEngine.recognize(getApplicationContext(), image, anchor);\n    }\n'''
          new_run = '''    private void runOcr(Button button) {\n        if (ocrRunning || payload == null || payload.image == null || payload.image.isRecycled()) return;\n        ocrRunning = true;\n        button.setEnabled(false);\n        button.setText("识别中…");\n        Bitmap image = payload.image;\n        Rect anchor = payload.anchor == null ? null : new Rect(payload.anchor);\n        DiagnosticLog.i(this, "SCREENSHOT_RESULT", "OCR_BUTTON image="\n                + image.getWidth() + "x" + image.getHeight() + " mode=inline");\n\n        ResultTextActivity.captureNextForImage(image, (text, blocks) -> runOnUiThread(() -> {\n            if (isFinishing() || isDestroyed() || payload == null || payload.image != image) return;\n            ocrRunning = false;\n            button.setEnabled(true);\n            button.setText("重新识别");\n            showInlineOcr(text);\n        }));\n\n        button.postDelayed(() -> {\n            if (!ocrRunning) return;\n            ResultTextActivity.clearInlineForImage(image);\n            ocrRunning = false;\n            button.setEnabled(true);\n            button.setText("OCR");\n            DiagnosticLog.i(this, "SCREENSHOT_RESULT", "OCR_INLINE_TIMEOUT");\n        }, 12000L);\n\n        OcrEngine.recognize(getApplicationContext(), image, anchor);\n    }\n\n    private void showInlineOcr(String text) {\n        if (ocrPanel == null || ocrText == null) return;\n        String value = text == null ? "" : text.trim();\n        ocrText.setText(value.isEmpty() ? "未识别到文字" : value);\n        ocrPanel.setVisibility(View.VISIBLE);\n\n        Rect usable = popupUsable == null ? usableBounds() : new Rect(popupUsable);\n        int expandedH = Math.min(dp(610), Math.round(usable.height() * .72f));\n        expandedH = Math.max(dp(360), expandedH);\n        positionWindow(usable, popupWidth > 0 ? popupWidth : Math.min(dp(410), usable.width()),\n                expandedH, payload == null ? null : payload.anchor);\n        DiagnosticLog.i(this, "SCREENSHOT_RESULT", "OCR_INLINE chars=" + value.length()\n                + " expandedH=" + expandedH);\n    }\n'''
          if old_run in s:
              s = s.replace(old_run, new_run, 1)
          elif new_run not in s:
              raise SystemExit('Screenshot runOcr marker missing')

          # Avoid stale one-shot result target when closing the screenshot popup.
          old_destroy = '''    @Override protected void onDestroy() {\n        if (token != 0L) PENDING.remove(token);\n        super.onDestroy();\n    }\n'''
          new_destroy = '''    @Override protected void onDestroy() {\n        if (payload != null && payload.image != null) {\n            ResultTextActivity.clearInlineForImage(payload.image);\n        }\n        if (token != 0L) PENDING.remove(token);\n        super.onDestroy();\n    }\n'''
          if old_destroy in s:
              s = s.replace(old_destroy, new_destroy, 1)
          elif new_destroy not in s:
              raise SystemExit('Screenshot onDestroy marker missing')
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/ResultTextActivity.java app/src/main/java/com/yagay/floatlens/ScreenshotResultActivity.java
          git commit -m "Show OCR inline under screenshot image"
          git push
