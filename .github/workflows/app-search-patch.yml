name: App Search Patch

on:
  push:
    branches: [ refactor/ui-structure-v2 ]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add application search
        run: python3 .github/patch_app_search.py

      - name: Fix lambda capture
        run: python3 .github/fix_app_search_capture.py

      - name: Commit source changes
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "FloatLens CI"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/yagay/floatlens/MenuPickerActivity.java
            git commit -m "feat(menu): add search to application pickers"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug
