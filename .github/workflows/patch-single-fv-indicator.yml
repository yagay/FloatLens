name: One-shot Single FV Indicator Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-single-fv-indicator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove duplicate fullscreen pointer drawing
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/yagay/floatlens/ViewHoverOverlay.java')
          s = p.read_text()
          marker = '// Probe indicator is rendered by the single stateful FvActionHintOverlay.'
          if marker in s:
              print('already patched')
          else:
              pattern = re.compile(r'\n\s*// FV keeps a small helper/handler view after the main FloatIconView expands fullscreen\.\n\s*// Draw an equivalent non-touchable pointer marker at the transformed selection hotspot\.\n\s*if \(!Float\.isNaN\(pointerX\) && !Float\.isNaN\(pointerY\)\) \{.*?\n\s*\}\n', re.S)
              replacement = '\n            // Probe indicator is rendered by the single stateful FvActionHintOverlay.\n            // This fullscreen layer only draws View/region selection bounds.\n'
              out, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('pointer block not found; refusing broad rewrite')
              p.write_text(out)
              print('patched')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/yagay/floatlens/ViewHoverOverlay.java
          git commit -m 'Remove duplicate fullscreen FV pointer'
          git push origin HEAD:main
