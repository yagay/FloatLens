name: One-shot image share wiring

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot image share wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire long-press share into View image popups
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          p = 'app/src/main/java/com/yagay/floatlens/ViewContentActivity.java'
          replace_once(p,
              '            iv.setScaleType(ImageView.ScaleType.FIT_CENTER);\n            body.addView(iv, new LinearLayout.LayoutParams(-1, imageH));',
              '            iv.setScaleType(ImageView.ScaleType.FIT_CENTER);\n            ImageShareUtils.attachLongPressShare(this, iv, payload.image);\n            body.addView(iv, new LinearLayout.LayoutParams(-1, imageH));')

          p = 'app/src/main/java/com/yagay/floatlens/ResultOverlay.java'
          replace_once(p,
              '        iv.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        body.addView(iv, new LinearLayout.LayoutParams(-1, h));',
              '        iv.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        ImageShareUtils.attachLongPressShare(c, iv, image);\n        body.addView(iv, new LinearLayout.LayoutParams(-1, h));')

          p = 'app/build.gradle'
          replace_once(p,
              "        versionCode 75\n        versionName '3.0.23'",
              "        versionCode 76\n        versionName '3.0.24'")
      - name: Commit fix
        run: |
          git config user.name "FloatLens Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/ViewContentActivity.java \
                  app/src/main/java/com/yagay/floatlens/ResultOverlay.java \
                  app/build.gradle
          git commit -m "Add long-press image sharing in 3.0.24"
          git push
