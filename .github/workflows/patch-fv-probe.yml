name: One-shot FV Probe Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-fv-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire live MOVE to FV helper overlays
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/yagay/floatlens/FloatIconView.java')
          s = p.read_text()
          old = '''                if(followStarted && selectionEngine!=null && selectionEngine.available()) {
                      armOrRearmDirectSelection(rx, ry);
                  }
          '''
          new = '''                if(followStarted && selectionEngine!=null && selectionEngine.available()) {
                      // FV updates the independent ProbePoint/action-helper windows on every MOVE.
                      // The exact same transformed point is later reused for View hit testing.
                      selectionEngine.showProbe(rx, ry);
                      armOrRearmDirectSelection(rx, ry);
                  }
          '''
          if new in s:
              print('already patched')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('patched')
          else:
              raise SystemExit('target block not found; refusing broad rewrite')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/yagay/floatlens/FloatIconView.java
          git commit -m 'Wire FV helper overlays into live MOVE stream'
          git push origin HEAD:main
