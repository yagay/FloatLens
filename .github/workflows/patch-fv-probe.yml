name: One-shot FV Probe Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-fv-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire live MOVE to FV helper overlays
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/yagay/floatlens/FloatIconView.java')
          s = p.read_text()
          marker = 'selectionEngine.showProbe(rx, ry);'
          if marker in s:
              print('already patched')
          else:
              pattern = re.compile(
                  r'(?m)^(?P<i>[ \t]*)if\(followStarted && selectionEngine!=null && selectionEngine\.available\(\)\) \{\n'
                  r'(?P=i)    armOrRearmDirectSelection\(rx, ry\);\n'
                  r'(?P=i)\}'
              )
              def repl(m):
                  i = m.group('i')
                  return (
                      i + 'if(followStarted && selectionEngine!=null && selectionEngine.available()) {\n'
                      + i + '    // FV updates the independent ProbePoint/action-helper windows on every MOVE.\n'
                      + i + '    // The exact same transformed point is later reused for View hit testing.\n'
                      + i + '    selectionEngine.showProbe(rx, ry);\n'
                      + i + '    armOrRearmDirectSelection(rx, ry);\n'
                      + i + '}'
                  )
              patched, count = pattern.subn(repl, s, count=1)
              if count != 1:
                  raise SystemExit(f'target block count={count}; refusing broad rewrite')
              p.write_text(patched)
              print('patched exactly one MOVE block')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/yagay/floatlens/FloatIconView.java
          git commit -m 'Wire FV helper overlays into live MOVE stream'
          git push origin HEAD:main
