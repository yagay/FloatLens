name: Normalize FL naming once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  rename:
    if: ${{ !contains(github.event.head_commit.message, '[fl-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize FloatLens-owned FV identifiers to FL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('docs'), Path('README.md')]
          exts = {'.java','.kt','.xml','.md','.txt','.list','.prop','.gradle','.kts','.yml','.yaml'}
          replacements = {
              'FvOverlayWindowHost': 'FlOverlayWindowHost',
              'FvInspectorReceiver': 'FlInspectorReceiver',
              'FvPointerOperationHintOverlay': 'FlPointerOperationHintOverlay',
              'FvProbePointOverlay': 'FlProbePointOverlay',
              'FvRegionFrameOverlay': 'FlRegionFrameOverlay',
              'FvSystemPanelController': 'FlSystemPanelController',
              'FvInspectorConfig': 'FlInspectorConfig',
              'FvRuntimeModule': 'FlRuntimeModule',
              'FvSessionTracker': 'FlSessionTracker',
              'FV_': 'FL_',
              'fv_pointer_': 'fl_pointer_',
              'FV_HOOK_': 'FL_HOOK_',
              'FloatLens-FV': 'FloatLens-FL',
              'floatlens-fv': 'floatlens-fl',
              'fv-runtime-inspector': 'fl-runtime-inspector',
              'FV Runtime Inspector': 'FL Runtime Inspector',
              'FV Hook': 'FL Hook',
              'FV 诊断日志': 'FL 诊断日志',
              'FV式位置逻辑': 'FL 位置逻辑（参照 FV）',
              'fvDelayMs': 'flDelayMs',
              'fvPrepare': 'flPrepare',
              'fv_region_saved_fallback': 'fl_region_saved_fallback',
              'fv follow origin': 'fl follow origin',
          }

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in exts)

          changed = []
          for p in files:
              try:
                  old = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new = old
              for a, b in replacements.items():
                  new = new.replace(a, b)
              if new != old:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          print('changed files:', len(changed))
          for p in changed:
              print(p)
          PY

          rm -f app/src/main/java/com/yagay/floatlens/Fv*.java
          rm -f app/src/main/java/com/yagay/floatlens/hook/Fv*.java
          rm -f app/src/main/res/drawable/fv_pointer_*.xml

          echo '--- Remaining FloatLens-owned old identifiers (intentional FV references may remain) ---'
          grep -RInE 'Fv(OverlayWindowHost|InspectorReceiver|PointerOperationHintOverlay|ProbePointOverlay|RegionFrameOverlay|SystemPanelController|InspectorConfig|RuntimeModule|SessionTracker)|FV_(WINDOW|DIRECT|SELECT|REGION|TREE_CACHE|PROBE|PROBE_VIEW|POINTER_HINT|REGION_FRAME|SHADE|HOOK)|fv_pointer_|FloatLens-FV|floatlens-fv|fv-runtime-inspector' app docs README.md 2>/dev/null || true

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fl-rename-once.yml

      - name: Commit normalized names
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize FloatLens naming to FL [fl-normalized]'
          git push origin HEAD:main
