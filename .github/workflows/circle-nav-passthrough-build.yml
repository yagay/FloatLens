name: Circle Navigation Passthrough Build

on:
  push:
    branches: [ refactor/ui-structure-v2 ]
    paths:
      - '.github/patch_circle_nav_passthrough.py'
      - '.github/workflows/circle-nav-passthrough-build.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/ui-structure-v2
          fetch-depth: 0

      - name: Apply navigation passthrough patch
        run: python .github/patch_circle_nav_passthrough.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/CircleSelectFrame.java app/src/main/java/com/yagay/floatlens/CircleSelectOverlay.java
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix(circle): let system navigation exit circle mode"
            git push origin HEAD:refactor/ui-structure-v2
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug-circle-nav-passthrough
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
