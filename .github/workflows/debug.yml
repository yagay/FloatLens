name: Finish FL Naming Cleanup

on:
  push:
    branches: [ "rename/fv-to-fl" ]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/fv-to-fl
          fetch-depth: 0

      - name: Fix remaining migrated references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              'app/src/main/java/com/yagay/floatlens/FloatIconTouchHandle.java': [
                  ('FV keeps a separate FloatIconView$l window beside the 119x119 visible icon. Runtime capture shows',
                   'FL keeps a separate invisible edge handle beside the visible icon. The current geometry uses'),
              ],
              'app/src/main/java/com/yagay/floatlens/ViewSelectionEngine.java': [
                  ("Region dragging and selected-View readiness are intentionally separate. FV's FooViewService owns",
                   'Region dragging and selected-View readiness are intentionally separate. FL owns'),
                  (' * the dwell/re-arm state and calls o1/n1.d(false/true) on the selected View rectangle. FloatLens',
                   ' * the dwell/re-arm state for the selected View rectangle. FloatLens'),
                  (' * mirrors that relationship: ViewHoverOverlay is passive; this engine owns the 400ms / ±3dp state.',
                   ' * keeps ViewHoverOverlay passive; this engine owns the 400ms / ±3dp state.'),
              ],
              'docs/ARCHITECTURE.md': [
                  ('keep FV-compatible', 'keep FL'),
              ],
          }

          for filename, pairs in edits.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
          git fetch origin main
          git show origin/main:.github/workflows/debug.yml > .github/workflows/debug.yml

      - name: Remaining references
        run: grep -RniE 'FV|fv[A-Z_]|fv_' app/src/main docs README.md || true

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main docs .github/workflows/debug.yml
          git commit -m 'Finish FL naming cleanup'
          git push origin HEAD:rename/fv-to-fl
