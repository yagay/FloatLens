name: Debug Build

on:
  push:
    branches: [ main, refactor/ui-structure-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply settings hierarchy cleanup
        if: github.event_name == 'push' && github.event.head_commit.message == 'ci: apply settings hierarchy cleanup'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Home: menu management moves under Appearance; gesture action mapping moves under Gesture.
          p = Path('app/src/main/java/com/yagay/floatlens/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '"跟随系统 / 浅色 / 深色，以及文字菜单主栏数量",',
              '"主题、文字菜单数量和菜单管理",', 1)
          gesture_nav = '''        AppUi.addRow(settings.body, AppUi.navRow(this,\n                "手势动作映射",\n                "指定单击、长按和各方向滑动动作",\n                () -> startActivity(SettingsActivity.intent(this, SettingsActivity.SECTION_ACTIONS))));\n'''
          s = s.replace(gesture_nav, '', 1)
          menu_start = s.find('        AppUi.Section menus = AppUi.section(this, "菜单管理",')
          if menu_start >= 0:
              menu_end = s.index('        AppUi.Section advanced = AppUi.section(this, "高级", null);', menu_start)
              s = s[:menu_start] + s[menu_end:]
          p.write_text(s, encoding='utf-8')

          # Appearance: add menu-management entries below text-menu density settings.
          p = Path('app/src/main/java/com/yagay/floatlens/AppearanceSettingsActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"主题模式和文字菜单主栏显示数量。" );',
                        '"主题、文字菜单显示和各类菜单管理。" );', 1)
          anchor = '        root.addView(note);\n\n        setContentView(AppUi.scrollPage(this, root));'
          if anchor not in s:
              raise SystemExit('AppearanceSettingsActivity anchor missing')
          menus = '''        root.addView(note);\n\n        AppUi.Section menus = AppUi.section(this, "菜单管理",\n                "管理结果菜单中的项目、顺序和隐藏状态。" );\n        AppUi.addRow(menus.body, AppUi.navRow(this,\n                "文字操作菜单",\n                "添加、排序和移除自定义文字操作",\n                () -> startActivity(MenuPickerActivity.customIntent(this))));\n        AppUi.addRow(menus.body, AppUi.navRow(this,\n                "分享菜单",\n                "管理分享目标和显示顺序",\n                () -> startActivity(MenuPickerActivity.targetIntent(this, TargetMenuStore.MODE_SHARE))));\n        AppUi.addRow(menus.body, AppUi.navRow(this,\n                "打开 / 处理菜单",\n                "管理 PROCESS_TEXT 目标和显示顺序",\n                () -> startActivity(MenuPickerActivity.targetIntent(this, TargetMenuStore.MODE_PROCESS))));\n        AppUi.addSection(root, menus);\n\n        setContentView(AppUi.scrollPage(this, root));'''
          s = s.replace(anchor, menus, 1)
          p.write_text(s, encoding='utf-8')

          # Settings: remove standalone action category and append the existing action sections
          # to the Gesture page. Keep SECTION_ACTIONS for backward-compatible old intents.
          p = Path('app/src/main/java/com/yagay/floatlens/SettingsActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '        addCategory(categories.body, "手势动作映射", "给每种手势分配动作", SECTION_ACTIONS);\n',
              '', 1)

          action_start = s.index('    private LinearLayout buildActionsPage() {')
          action_end = s.index('\n    private ', action_start + 20)
          action_block = s[action_start:action_end]
          section_start = action_block.index('        AppUi.Section tap =')
          return_pos = action_block.rindex('        return root;')
          section_code = action_block[section_start:return_pos]

          new_action_block = '''    private LinearLayout buildActionsPage() {\n        LinearLayout root = AppUi.pageRoot(this, "手势动作映射",\n                "动作映射现在归入“手势与轨迹”，此页仅为旧入口兼容保留。" );\n        appendActionMappingSections(root);\n        return root;\n    }\n\n    private void appendActionMappingSections(LinearLayout root) {\n''' + section_code + '    }\n'
          s = s[:action_start] + new_action_block + s[action_end:]

          gesture_anchor = '        AppUi.addSection(root, feedback);\n        return root;\n    }\n\n    private LinearLayout buildCapturePage()'
          if gesture_anchor not in s:
              raise SystemExit('gesture page anchor missing')
          s = s.replace(
              gesture_anchor,
              '        AppUi.addSection(root, feedback);\n\n        appendActionMappingSections(root);\n        return root;\n    }\n\n    private LinearLayout buildCapturePage()',
              1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "FloatLens CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/MainActivity.java \
                  app/src/main/java/com/yagay/floatlens/AppearanceSettingsActivity.java \
                  app/src/main/java/com/yagay/floatlens/SettingsActivity.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "refactor: group gesture mapping and menu management"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
