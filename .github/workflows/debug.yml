name: Debug Build

on:
  push:
    branches: [ main, refactor/ui-structure-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move gesture action mapping under gesture settings
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'ci move gesture action mapping entry v2' }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/yagay/floatlens/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          old = '''        AppUi.addRow(settings.body, AppUi.navRow(this,
                "手势动作映射",
                "指定单击、长按和各方向滑动动作",
                () -> startActivity(SettingsActivity.intent(this, SettingsActivity.SECTION_ACTIONS))));
'''
          if old in s:
              s = s.replace(old, '')
          main.write_text(s, encoding='utf-8')

          settings = Path('app/src/main/java/com/yagay/floatlens/SettingsActivity.java')
          s = settings.read_text(encoding='utf-8')
          s = s.replace('        addCategory(categories.body, "手势动作映射", "给每种手势分配动作", SECTION_ACTIONS);\n', '')

          marker = '''        AppUi.addRow(feedback.body, colorsBlock);\n        AppUi.addSection(root, feedback);\n        return root;\n    }\n'''
          replacement = '''        AppUi.addRow(feedback.body, colorsBlock);\n        AppUi.addSection(root, feedback);\n\n        AppUi.Section actions = AppUi.section(this, "动作映射",\n                "给单击、双击、长按、圈选和各方向滑动分配动作。" );\n        AppUi.addRow(actions.body, AppUi.navRow(this,\n                "手势动作映射",\n                "设置每种手势执行的具体动作",\n                () -> startActivity(intent(this, SECTION_ACTIONS))));\n        AppUi.addSection(root, actions);\n        return root;\n    }\n'''
          if 'AppUi.Section actions = AppUi.section(this, "动作映射"' not in s:
              if marker not in s:
                  raise SystemExit('SettingsActivity gesture page marker not found')
              s = s.replace(marker, replacement, 1)
          settings.write_text(s, encoding='utf-8')
          PY

          git config user.name "FloatLens CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/MainActivity.java app/src/main/java/com/yagay/floatlens/SettingsActivity.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ui): nest gesture action mapping under gesture settings"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
