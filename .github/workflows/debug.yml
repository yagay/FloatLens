name: Debug Build

on:
  push:
    branches: [ main, feature/google-bridge-container ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy circle namespace
        shell: bash
        run: |
          set -euo pipefail
          legacy_a='Google''Circle'
          legacy_b='G_''CIRCLE'
          legacy_c='google_''circle'
          legacy_d='google-''circle'
          pattern="${legacy_a}|${legacy_b}|${legacy_c}|${legacy_d}"
          if git grep -n -E "$pattern" -- .; then
            echo "Legacy YFloat circle namespace found. Use FLCircle / FL_CIRCLE / fl_circle naming."
            exit 1
          fi
          echo "Legacy circle namespace scan passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --stacktrace lintDebug
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== Full Android lint report ====="
              cat "$report"
              echo "===== End Android lint report ====="
            fi
          fi
          exit "$status"

      - name: Build arm64-v8a debug APK
        run: gradle --stacktrace assembleDebug

      - name: Prepare fixed APK name
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*/debug/*' | head -n 1)"
          test -n "$APK"
          ABIS="$(unzip -l "$APK" | awk '{print $4}' | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABIs in APK: $ABIS"
            exit 1
          fi
          cp "$APK" artifacts/YFloat-debug-arm64-v8a.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YFloat-debug-arm64-v8a
          path: artifacts/YFloat-debug-arm64-v8a.apk
          if-no-files-found: error
