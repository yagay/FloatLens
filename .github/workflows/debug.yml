name: Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run unit tests
        run: gradle --stacktrace testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --stacktrace lintDebug
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "===== Full Android lint report ====="
              cat "$report"
              echo "===== End Android lint report ====="
            fi
          fi
          exit "$status"

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
