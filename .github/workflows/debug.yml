name: Debug Build

on:
  push:
    branches: [ main, refactor/ui-structure-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-row total-count menu fix
        if: >-
          github.event_name == 'push' &&
          github.event.head_commit.message == 'ci: apply text menu total count fix v2'
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          path = Path('app/src/main/java/com/yagay/floatlens/FloatActionMenu.java')
          s = path.read_text(encoding='utf-8')
          s = s.replace('+ (mode == MODE_MAIN ? " pinnedCustom=" + TextMenuSettings.pinnedCustomCount(app) : "")', '+ (mode == MODE_MAIN ? " mainItems=" + TextMenuSettings.mainItemCount(app) : "")')
          start = s.index('    private static void buildMainToolbar(')
          end = s.index('    private static void buildMoreMenu(', start)
          new_block = base64.b64decode('').decode('utf-8')
          s = s[:start] + new_block + s[end:]
          s = s.replace('int skip = mainCustomCount(app, customs.size());', 'int skip = mainCustomCount(app, customs.size(), selectAll != null);')
          if 'pinnedCustomCount' in s:
              raise SystemExit('old pinnedCustomCount reference still present')
          if 'mainCustomCount(app, customs.size());' in s:
              raise SystemExit('old mainCustomCount call still present')
          path.write_text(s, encoding='utf-8')
          PY
          git config user.name "FloatLens CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/FloatActionMenu.java
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: make text menu count control total items"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
