name: Circle Bottom Controls Build

on:
  push:
    branches: [ tmp-circle-bottom-controls ]
    paths:
      - '.github/patch_circle_bottom_controls.py'
      - '.github/workflows/circle-bottom-controls-build.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-circle-bottom-controls
          fetch-depth: 0

      - name: Apply circle controls patch
        run: python .github/patch_circle_bottom_controls.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/CircleSelectOverlay.java
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix(circle): move hint and close control to bottom"
            git push origin HEAD:tmp-circle-bottom-controls
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug-circle-bottom-controls
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
