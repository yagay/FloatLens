name: One-shot configurable long press

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot configurable long-press migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make long press fully configurable
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # Rename the old hard-coded region-editor marker so runtime state reflects what it really means.
          p = Path('app/src/main/java/com/yagay/floatlens/FloatIconView.java')
          s = p.read_text()
          s = s.replace('regionEditorTriggered', 'longPressActionTriggered')
          old = '''                // User-requested stationary long-press editor remains separate. A real drag cancels
                // it and follows FV's q Runnable path below.
                if(!positionMoveMode){
                    longPressRunnable = () -> {
                        if (!session.multiTouch && !followStarted && session.phase == GestureSession.Phase.DOWN
                                && session.distance() < dp(FV_DIRECT_MOVE_START_DP)) {
                            session.longPressReady = true;
                            longPressActionTriggered = true;
                            cancelDirectSelectionTimer();
                            if(selectionEngine!=null)selectionEngine.cancel();
                            DiagnosticLog.i(getContext(),"REGION_EDIT","stationary_long_press_armed duration="
                                    +session.duration(SystemClock.uptimeMillis()));
                            if (fs.vibrate()) performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
                            invalidate();
                        }
                    };
                    handler.postDelayed(longPressRunnable, fs.longPressMs());
                }
'''
          new = '''                // Stationary long press is now purely an action-layer gesture. There is no
                // hard-coded OCR/region-editor behavior here: Settings -> action_long_press is the
                // single source of truth.
                if(!positionMoveMode){
                    longPressRunnable = () -> {
                        if (!session.multiTouch && !followStarted && session.phase == GestureSession.Phase.DOWN
                                && session.distance() < dp(FV_DIRECT_MOVE_START_DP)) {
                            session.longPressReady = true;
                            longPressActionTriggered = true;
                            cancelDirectSelectionTimer();
                            if(selectionEngine!=null)selectionEngine.cancel();
                            String configured = fs.action(FloatSettings.K_ACTION_LONG, ActionId.NONE);
                            DiagnosticLog.i(getContext(),"LONG_PRESS","trigger duration="
                                    +session.duration(SystemClock.uptimeMillis())+" action="+configured);
                            if (fs.vibrate()) performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
                            if (!ActionId.NONE.equals(configured)) cb.onAction(configured);
                            invalidate();
                        }
                    };
                    handler.postDelayed(longPressRunnable, fs.longPressMs());
                }
'''
          if old not in s:
              raise SystemExit('long-press arm block not found')
          s = s.replace(old, new, 1)
          old = '''                if(longPressActionTriggered){
                    if(selectionEngine!=null)selectionEngine.cancel();
                    cb.onGestureEnd(session.snapshot());
                    cb.onRelease(followStarted);
                    DiagnosticLog.i(getContext(),"REGION_EDIT","launch_on_release");
                    ScreenshotController.captureForRegionEditor(getContext());
                    resetSession();
                    return true;
                }
'''
          new = '''                if(longPressActionTriggered){
                    if(selectionEngine!=null)selectionEngine.cancel();
                    cb.onGestureEnd(session.snapshot());
                    cb.onRelease(followStarted);
                    DiagnosticLog.i(getContext(),"LONG_PRESS","release consumed");
                    resetSession();
                    return true;
                }
'''
          if old not in s:
              raise SystemExit('long-press release block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # No implicit OCR fallback for long press in the gesture mapper.
          replace_once(
              'app/src/main/java/com/yagay/floatlens/GestureActionMapper.java',
              '            case GestureCode.ENTER_CIRCLE -> fs.action(FloatSettings.K_ACTION_LONG, ActionId.OCR);',
              '            case GestureCode.ENTER_CIRCLE -> fs.action(FloatSettings.K_ACTION_LONG, ActionId.NONE);')

          # Settings UI: long press is a normal configurable action; default is NONE.
          p = 'app/src/main/java/com/yagay/floatlens/SettingsActivity.java'
          replace_once(p,
              '        map.put("长按进入 Circle / action_long_press", FloatSettings.K_ACTION_LONG);',
              '        map.put("长按 / action_long_press", FloatSettings.K_ACTION_LONG);')
          replace_once(p,
              '        if (k.equals(FloatSettings.K_ACTION_LONG) || k.equals(FloatSettings.K_ACTION_RECOGNIZE)) return ActionId.OCR;',
              '        if (k.equals(FloatSettings.K_ACTION_LONG)) return ActionId.NONE;\n        if (k.equals(FloatSettings.K_ACTION_RECOGNIZE)) return ActionId.OCR;')

          # One-time migration: old releases auto-defaulted/stored long press as OCR. Reset only that
          # legacy value to NONE; preserve every other explicit action choice.
          p = 'app/src/main/java/com/yagay/floatlens/FloatSettings.java'
          replace_once(p,
              '    public static final String K_DIAGNOSTIC = "fv_diagnostic_logging";',
              '    public static final String K_DIAGNOSTIC = "fv_diagnostic_logging";\n    private static final String K_MIGRATE_LONG_PRESS_CONFIG_V1 = "migrate_long_press_config_v1";')
          replace_once(p,
              '        Object old = p.getAll().get(K_HIDE_FULLSCREEN);\n        if (old instanceof Boolean b) p.edit().putInt(K_HIDE_FULLSCREEN, b ? 2 : 0).apply();',
              '        Object old = p.getAll().get(K_HIDE_FULLSCREEN);\n        if (old instanceof Boolean b) p.edit().putInt(K_HIDE_FULLSCREEN, b ? 2 : 0).apply();\n        if (!p.getBoolean(K_MIGRATE_LONG_PRESS_CONFIG_V1, false)) {\n            SharedPreferences.Editor e = p.edit();\n            if (ActionId.OCR.equals(p.getString(K_ACTION_LONG, null))) e.remove(K_ACTION_LONG);\n            e.putBoolean(K_MIGRATE_LONG_PRESS_CONFIG_V1, true).apply();\n        }')

          replace_once(
              'app/build.gradle',
              "        versionCode 78\n        versionName '3.0.26'",
              "        versionCode 79\n        versionName '3.0.27'")

      - name: Commit fix
        run: |
          git config user.name "FloatLens Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/FloatIconView.java \
                  app/src/main/java/com/yagay/floatlens/GestureActionMapper.java \
                  app/src/main/java/com/yagay/floatlens/SettingsActivity.java \
                  app/src/main/java/com/yagay/floatlens/FloatSettings.java \
                  app/build.gradle
          git commit -m "Make long press fully configurable in 3.0.27"
          git push
