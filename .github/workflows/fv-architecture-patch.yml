name: FV Architecture Patch

on:
  push:
    branches: [ refactor/ui-structure-v2 ]
    paths:
      - '.github/patch_fv_architecture.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/ui-structure-v2
          fetch-depth: 0
      - name: Apply FV architecture patch
        run: python .github/patch_fv_architecture.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "refactor: match FV direct selection architecture"
            git push origin HEAD:refactor/ui-structure-v2
          fi
