name: ML First Logo Rescue

on:
  push:
    branches: [ tmp-ml-first-logo-rescue ]
    paths:
      - '.github/patch_ml_first_logo_rescue.py'
      - '.github/workflows/ml-first-logo-rescue.yml'
      - 'app/src/main/java/com/yagay/floatlens/OcrImagePreprocessor.java'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-ml-first-logo-rescue
          fetch-depth: 0

      - name: Apply ML-first patch
        run: python .github/patch_ml_first_logo_rescue.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/CircleRecognitionSession.java
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "refactor(circle): prefer ML Kit rescue geometry"
            git push origin HEAD:tmp-ml-first-logo-rescue
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug-ml-first-logo-rescue
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
