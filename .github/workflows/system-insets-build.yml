name: System Insets Build

on:
  push:
    branches: [ tmp-system-insets ]
    paths:
      - '.github/patch_system_insets.py'
      - '.github/workflows/system-insets-build.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-system-insets
          fetch-depth: 0

      - name: Apply system inset patch
        run: python .github/patch_system_insets.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/AppUi.java
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix(ui): keep app content outside system bars"
            git push origin HEAD:tmp-system-insets
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatLens-debug-system-insets
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
