name: One-shot result button layout fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot result button layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin result actions and fix window coordinates
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              s = s.replace(old, new, 1)
              p.write_text(s)

          # OCR result Activity: absolute screen coordinates + weighted scroll body.
          p = 'app/src/main/java/com/yagay/floatlens/ResultTextActivity.java'
          replace_once(p,
              '        w.setDimAmount(0f);\n        setFinishOnTouchOutside(true);',
              '        w.setDimAmount(0f);\n        // PositionWindow uses absolute screen coordinates; keep the Activity window in the same coordinate space.\n        w.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN);\n        setFinishOnTouchOutside(true);')
          replace_once(p,
              '        box.addView(bodyScroll, new LinearLayout.LayoutParams(-1, bodyH));',
              '        // The body is the only flexible area. Header/actions always keep their fixed height even\n        // when Dialog decor or OEM insets reduce the real content viewport.\n        box.addView(bodyScroll, new LinearLayout.LayoutParams(-1, 0, 1f));')
          replace_once(p,
              '        positionWindow(usable, popupW, popupH, payload.anchor);',
              '        positionWindow(usable, popupW, popupH, payload.anchor);\n        DiagnosticLog.i(this, "RESULT_LAYOUT", "OCR pinnedActions=true requestedBody=" + bodyH\n                + " popupH=" + popupH);')

          # Direct View-content Activity: same rule.
          p = 'app/src/main/java/com/yagay/floatlens/ViewContentActivity.java'
          replace_once(p,
              '        w.setDimAmount(0f);\n        setFinishOnTouchOutside(true);',
              '        w.setDimAmount(0f);\n        // Anchor/usable bounds are screen coordinates, so use the full-screen WindowManager coordinate space.\n        w.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN);\n        setFinishOnTouchOutside(true);')
          replace_once(p,
              '        box.addView(scroll, new LinearLayout.LayoutParams(-1, bodyH));',
              '        // Only the middle body may shrink/scroll. Keep the bottom action row pinned and visible.\n        box.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1f));')
          replace_once(p,
              '        positionWindow(usable, width, height, payload.anchor);',
              '        positionWindow(usable, width, height, payload.anchor);\n        DiagnosticLog.i(this, "RESULT_LAYOUT", "VIEW pinnedActions=true requestedBody=" + bodyH\n                + " popupH=" + height);')

          # Version bump.
          p = 'app/build.gradle'
          replace_once(p, "        versionCode 74\n        versionName '3.0.22'", "        versionCode 75\n        versionName '3.0.23'")
      - name: Commit fix
        run: |
          git config user.name "FloatLens Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/yagay/floatlens/ResultTextActivity.java \
                  app/src/main/java/com/yagay/floatlens/ViewContentActivity.java \
                  app/build.gradle
          git commit -m "Fix pinned result buttons in 3.0.23"
          git push
